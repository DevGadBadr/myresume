name: Deploy on push to master
on:
    push:
        branches:
            - master
concurrency:
    group: resume-deploy-master
    cancel-in-progress: true
jobs:
    deploy:
        runs-on:
            - self-hosted
            - linux
            - x64
            - resume-vps
        steps:
            -   name: Read deploy flag
                id: flag
                working-directory: /root/Gad/web/Apps/resume
                run: |
                    VALUE=$(tr -d '[:space:]' < .deploy)
                    echo "deploy=$VALUE" >> "$GITHUB_OUTPUT"

            -   name: Deploy locally on VPS
                if: steps.flag.outputs.deploy == 'true'
                working-directory: /root/Gad/web/Apps/resume
                run: |
                    export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
                    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
                    git fetch origin
                    git reset --hard origin/master
                    bash scripts/deploy.sh